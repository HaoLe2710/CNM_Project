spring.application.name=CNM_Project_BE
spring.config.import=optional:file:.env[.properties]

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.docker.compose.file=docker/docker-compose.yml

spring.datasource.url=jdbc:postgresql://localhost:5432/chat
spring.datasource.username=chat
spring.datasource.password=chat
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.user=chat
spring.flyway.password=chat
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.message.unsend-window-minutes=15
app.message.read-cursor.seen-throttle-ms=400
app.message.read-cursor.delivered-throttle-ms=300
app.cloud.storage.default-quota-bytes=1073741824
app.reminder.scheduler-fixed-delay-ms=60000
app.message-processing.scheduler-fixed-delay-ms=10000
app.message-processing.max-batch-size=10
app.message-processing.max-retry=3
app.message-processing.retry-base-delay-ms=5000
app.message-processing.retry-max-delay-ms=60000
app.message-processing.stt.provider=${MESSAGE_PROCESSING_STT_PROVIDER:openrouter}
app.message-processing.tts.provider=${MESSAGE_PROCESSING_TTS_PROVIDER:disabled}
app.message-processing.dictation.max-duration-ms=${DICTATION_MAX_DURATION_MS:90000}
app.message-processing.dictation.max-file-size-bytes=${DICTATION_MAX_FILE_SIZE_BYTES:10485760}
app.message-processing.dictation.cleanup-enabled=${DICTATION_CLEANUP_ENABLED:true}
app.message-processing.dictation.retention-hours=${DICTATION_RETENTION_HOURS:24}
app.message-processing.dictation.cleanup-fixed-delay-ms=${DICTATION_CLEANUP_FIXED_DELAY_MS:3600000}
app.message-processing.dictation.cleanup-batch-size=${DICTATION_CLEANUP_BATCH_SIZE:50}
app.message-processing.dictation.cleanup-retry-delay-minutes=${DICTATION_CLEANUP_RETRY_DELAY_MINUTES:30}
app.message-processing.dictation.rate-window-seconds=${DICTATION_RATE_WINDOW_SECONDS:300}
app.message-processing.dictation.rate-max-jobs=${DICTATION_RATE_MAX_JOBS:20}
app.message-processing.openai.api-key=${OPENAI_API_KEY:}
app.message-processing.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.message-processing.openai.stt-model=${OPENAI_STT_MODEL:gpt-4o-mini-transcribe}
app.message-processing.openai.tts-model=${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
app.message-processing.openai.default-voice=${OPENAI_TTS_VOICE:alloy}
app.message-processing.openai.timeout-seconds=${OPENAI_API_TIMEOUT_SECONDS:45}
app.message-processing.openrouter.api-key=${OPENROUTER_API_KEY:}
app.message-processing.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.message-processing.openrouter.stt-model=${OPENROUTER_STT_MODEL:openai/whisper-large-v3-turbo}
app.message-processing.openrouter.timeout-seconds=${OPENROUTER_API_TIMEOUT_SECONDS:60}
#app.storage.s3.region=ap-southeast-1
#app.storage.s3.bucket=
#app.storage.s3.endpoint=
#app.storage.s3.public-base-url=
#app.storage.s3.path-prefix=chat
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://openrouter.ai/api}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:openai/gpt-4o-mini}
spring.ai.openai.chat.options.max-tokens=${SPRING_AI_OPENAI_CHAT_OPTIONS_MAX_TOKENS:1000}

app.mail.from=no-reply@yourdomain.com
app.mail.from-name=${MAIL_FROM_NAME:Zalo App}

# Mail (SMTP) - read from .env / environment
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender address used by MailService
app.mail.from-address=${MAIL_FROM_ADDRESS:}
app.mail.reply-to=${MAIL_REPLY_TO:}

app.sfu.url=${SFU_URL:${APP_SFU_URL:http://localhost:4443}}
